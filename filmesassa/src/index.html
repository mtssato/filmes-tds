<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamFlix</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Ícones -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-film"></i>
            StreamFlix
        </div>

        <!-- Campo de Busca -->
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
                type="text"
                id="searchInput"
                placeholder="Buscar filmes..."
            />
        </div>
    </header>

    <!-- FILTROS -->
    <section class="filters">
        <button class="filter-btn active" data-filter="Todos">
            Todos
        </button>

        <button class="filter-btn" data-filter="Ação">
            Ação
        </button>

        <button class="filter-btn" data-filter="Drama">
            Drama
        </button>

        <button class="filter-btn" data-filter="Sci-Fi">
            Sci-Fi
        </button>

        <button class="filter-btn" data-filter="Terror">
            Terror
        </button>

        <button class="filter-btn" data-filter="Comédia">
            Comédia
        </button>
    </section>

    <!-- GRID DE FILMES -->
    <main>
        <section class="movies-container" id="moviesContainer">

            <!-- Os filmes serão renderizados pelo JS -->

        </section>
    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
