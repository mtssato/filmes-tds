<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiHub | Movies & Football</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="dashboard">
        <aside class="sidebar">
            <div class="brand">🚀 Hub<span>GO</span></div>
            <nav>
                <button class="nav-item active" data-type="all">Explorar Tudo</button>
                <button class="nav-item" data-type="movie">🎬 Filmes</button>
                <button class="nav-item" data-type="football">⚽ Futebol</button>
            </nav>
            <div class="search-box">
                <input type="text" id="mainSearch" placeholder="O que vamos ver?">
            </div>
        </aside>

        <main class="main-content">
            <header class="top-banner">
                <div class="banner-text">
                    <h1>Destaque da Semana</h1>
                    <p id="featuredDesc">Acompanhe os melhores momentos da Champions e as estreias do mês.</p>
                </div>
            </header>

            <section class="content-section">
                <div class="section-header">
                    <h2 id="sectionTitle">Catálogo Completo</h2>
                    <div class="genre-tags" id="tagContainer">
                        </div>
                </div>

                <div class="display-grid" id="mainGrid">
                    </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
